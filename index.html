function bayUnlockCost(b){return Math.round(3000*Math.pow(3,b-1))}

 let rows=Array.from({length:BAY_LIMIT},(_,b)=>{let plots=bayPlots(b),open=b<G.unlockedBays,planted=plots.filter(Boolean).length,ready=plots.filter(p=>p&&stage(p)===5).length;return `<button class="bigbtn" style="width:100%;margin:5px 0;opacity:${open?1:.65}" onclick="selectBay(${b})">${open?'BAY '+(b+1)+' • '+planted+'/6 planted • '+ready+' ready':'🔒 BAY '+(b+1)}</button>`}).join("");
 sheet.innerHTML=`<h2>Grow Bays</h2><p>Each bay has six independent plots. Swipe left or right on the grow room to navigate.</p>${rows}${G.unlockedBays<BAY_LIMIT?`<button class="bigbtn" onclick="unlockBay()">UNLOCK BAY ${G.unlockedBays+1} • $${bayUnlockCost(G.unlockedBays).toLocaleString()}</button>`:'<p>All six bays unlocked!</p>'}`;
 modal.classList.add("on")
}

const PERF_UI=["assets/branding/emb_farms_icon.webp"];
const PERF_CACHE=new Map();
function perfLoad(src,timeout=1200){
 if(!src)return Promise.resolve(false);
 if(PERF_CACHE.has(src))return PERF_CACHE.get(src);
 const p=new Promise(resolve=>{
   let settled=false;
   const finish=(ok)=>{if(settled)return;settled=true;clearTimeout(timer);resolve(ok)};
   const timer=setTimeout(()=>finish(false),timeout);
   const im=new Image();
   im.decoding="async";
   im.onload=()=>finish(true);
   im.onerror=()=>finish(false);
   im.src=src;
 });
 PERF_CACHE.set(src,p);return p;
}
